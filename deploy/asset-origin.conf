server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location ^~ /assets/ {
        if ($request_method = OPTIONS) {
            return 418;
        }
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 419;
        }

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Max-Age "86400" always;

        try_files $uri =404;
    }

    error_page 404 = @asset_not_found;
    error_page 418 = @asset_options;
    error_page 419 = @asset_method_not_allowed;

    location @asset_not_found {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        return 404 "Not Found\n";
    }

    location @asset_options {
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        add_header Access-Control-Max-Age "86400" always;
        return 204;
    }

    location @asset_method_not_allowed {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Allow "GET, HEAD, OPTIONS" always;
        return 405 "Method Not Allowed\n";
    }

    location / {
        return 404;
    }
}
