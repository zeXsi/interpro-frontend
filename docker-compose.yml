services:
  frontend:
    build: ./
    container_name: interpro-frontend
    restart: unless-stopped
    networks: [proxy-network, browser-network]
    depends_on:
      playwright:
        condition: service_healthy
    expose: ["5027"]
    environment:
      - PORT=5027
      - NODE_ENV=production
      - PLAYWRIGHT_WS_ENDPOINT=ws://playwright:3000/
      - PDF_RENDER_ORIGIN=http://frontend:5027

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    restart: unless-stopped
    networks: [browser-network]
    expose: ["3000"]
    init: true
    ipc: host
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  proxy-network:
    external: true
  browser-network:
