services:
  frontend:
    image: ${IMAGE_REF:?Full immutable IMAGE_REF is required}

  asset-origin:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: interpro-asset-origin
    restart: unless-stopped
    networks: [proxy-network]
    expose: ["8080"]
    volumes:
      - ${ASSET_DIR:-/srv/interpro-assets}:/usr/share/nginx/html/assets:ro
      - ./deploy/asset-origin.conf:/etc/nginx/conf.d/default.conf:ro
